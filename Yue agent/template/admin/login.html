<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ app_name }}</title>
  <link rel="preconnect" href="https://registry.npmmirror.com" crossorigin>
  <link rel="stylesheet" href="https://registry.npmmirror.com/misans/5.0.0/files/lib/Normal/MiSansVF.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { canvas: "#f1f5f9", ink: "#1e293b", brand: "#3b82f6" } } },
    };
  </script>
  <style>
    html, body { height: 100%; }
    body {
      background: #f1f5f9;
      color: #1e293b;
      font-family: "MiSans VF", MiSans, "HarmonyOS Sans SC", "PingFang SC",
                   "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei",
                   ui-sans-serif, system-ui, sans-serif;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
    <div class="flex h-14 items-center gap-2 px-4 md:px-6">
      <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-[#3b82f6] text-white text-xs font-semibold">Y</span>
      <span class="font-semibold tracking-tight">{{ app_name }}</span>
      <span class="text-xs text-gray-400">管理后台</span>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="mb-6 text-center">
        <h1 class="text-xl font-semibold text-[#1e293b]">管理员登录</h1>
        <p class="mt-1 text-sm text-gray-600">使用 .env 中配置的 ADMIN 账号进入后台</p>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% if error %}
        <div class="mb-4 rounded-xl border border-[#ef4444]/30 bg-[#ef4444]/10 px-4 py-3 text-sm text-[#b91c1c]" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/admin/login" class="space-y-4">
          <input type="hidden" name="next" value="{{ next_path }}">

          <div>
            <label for="username" class="mb-1.5 block text-sm font-medium text-gray-700">账号</label>
            <input id="username" type="text" name="username" autocomplete="username"
                   value="{{ username or '' }}" autofocus required
                   class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-[#1e293b] placeholder-gray-400 transition-all duration-150 ease-out focus:outline-none focus:ring-2 focus:ring-[#3b82f6] focus:border-transparent">
          </div>

          <div>
            <label for="password" class="mb-1.5 block text-sm font-medium text-gray-700">密码</label>
            <input id="password" type="password" name="password"
                   autocomplete="current-password" required
                   class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-[#1e293b] placeholder-gray-400 transition-all duration-150 ease-out focus:outline-none focus:ring-2 focus:ring-[#3b82f6] focus:border-transparent">
          </div>

          <button type="submit"
                  class="w-full inline-flex items-center justify-center rounded-lg font-medium text-sm transition-all duration-150 ease-out bg-[#3b82f6] text-white px-4 py-2.5 hover:-translate-y-0.5 hover:shadow-[0_4px_10px_rgba(59,130,246,0.4)] active:scale-[0.98] active:translate-y-0 active:shadow-none focus:outline-none focus:ring-2 focus:ring-[#3b82f6] focus:ring-offset-2">
            登录
          </button>
        </form>
      </div>

      <p class="mt-4 text-center text-xs text-gray-400">
        账号密码配置在 .env 的 ADMIN_USERNAME / ADMIN_PASSWORD
      </p>
    </div>
  </main>

  <footer class="sticky bottom-0 z-40 border-t border-gray-200 bg-white px-4 md:px-6 py-3">
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-gray-600">
      <span>{{ app_name }} · 管理后台</span>
      <span class="text-gray-400">仅限管理员访问</span>
    </div>
  </footer>
</body>
</html>
