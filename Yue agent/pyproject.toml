[project]
name = "Yue-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi[standard]>=0.146.0",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-deepseek>=1.1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/Yue",
    "src/app"
]
